# Shared development services. Managed by ~/.claude/scripts/db.sh; do not run `up` for
# everything at once, db.sh starts only the services a project needs.
# Secrets live in ~/infra/shared/.env (generated by db.sh, never committed).
# No ports are published: projects reach services by name over the external `shared` network.
name: shared

services:
  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run db.sh to generate secrets}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [shared]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run db.sh to generate secrets}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [shared]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.4.8-alpine
    restart: unless-stopped
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?run db.sh to generate secrets}
    # Per-project ACL users are saved to /data/users.acl; the default user is the admin.
    command: >-
      sh -c 'test -f /data/users.acl || echo "user default on >$$REDIS_ADMIN_PASSWORD ~* &* +@all" > /data/users.acl;
      exec redis-server --aclfile /data/users.acl --appendonly yes'
    volumes:
      - redis-data:/data
    networks: [shared]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_ADMIN_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  shared:
    name: shared

volumes:
  postgres-data:
  mysql-data:
  redis-data:
